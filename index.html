<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Shell</title>
<meta name="description" content="Tool Shell: a new way to organize your apps on Windows.">
<link rel="icon" href="favicon.ico">
<style>
  /* Colori animabili (la shell cambia sfondo e colori in modo fluido) */
  @property --c1 { syntax: "<color>"; inherits: true; initial-value: #3B82F6; }
  @property --c2 { syntax: "<color>"; inherits: true; initial-value: #1E3A8A; }
  @property --bt { syntax: "<color>"; inherits: true; initial-value: #0B1020; }
  @property --bb { syntax: "<color>"; inherits: true; initial-value: #111834; }
  @property --g1 { syntax: "<color>"; inherits: true; initial-value: rgba(59,130,246,.35); }
  @property --g2 { syntax: "<color>"; inherits: true; initial-value: rgba(139,92,246,.35); }

  :root {
    --bg: #05070F; --panel: #0F1526; --border: rgba(255,255,255,.08);
    --text: #F5F7FB; --subtle: #8E98AE; --a1: #60A5FA; --a2: #6366F1; --a3: #A855F7;
    --spring: cubic-bezier(.34, 1.4, .5, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); overflow-x: hidden; line-height: 1.5;
    font-family: "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 22px; }
  .grad { background: linear-gradient(120deg, var(--a1), var(--a2) 50%, var(--a3)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ---------- Barra ---------- */
  nav { position: fixed; inset: 0 0 auto; z-index: 50; height: 52px; backdrop-filter: saturate(180%) blur(20px);
        background: rgba(5,7,15,.7); border-bottom: 1px solid var(--border); }
  nav .wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; }
  .brand svg { width: 26px; height: 26px; }
  .navr { display: flex; align-items: center; gap: 16px; }
  .langs { display: flex; gap: 4px; }
  .langs button { border: 0; background: none; cursor: pointer; padding: 5px; border-radius: 7px; opacity: .45; transition: opacity .2s, background .2s; }
  .langs button:hover { opacity: .85; }
  .langs button.on { opacity: 1; background: rgba(255,255,255,.08); }
  .langs svg { display: block; width: 20px; height: 13px; border-radius: 2.5px; box-shadow: 0 0 0 1px rgba(255,255,255,.2); }
  .navbtn { font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 999px; background: linear-gradient(135deg, var(--a1), var(--a2)); }

  /* ---------- Apertura ---------- */
  .hero { position: relative; padding: 150px 0 40px; text-align: center; }
  .aurora { position: absolute; inset: -100px -20% auto; height: 900px; z-index: -1; filter: blur(80px); opacity: .55; pointer-events: none; }
  .aurora i { position: absolute; border-radius: 50%; animation: drift 18s ease-in-out infinite alternate; }
  .aurora i:nth-child(1) { width: 520px; height: 520px; left: 18%; top: 60px; background: #2563EB; }
  .aurora i:nth-child(2) { width: 460px; height: 460px; right: 16%; top: 140px; background: #7C3AED; animation-delay: -6s; }
  .aurora i:nth-child(3) { width: 380px; height: 380px; left: 42%; top: 320px; background: #DB2777; opacity: .6; animation-delay: -12s; }
  @keyframes drift { to { transform: translate(60px, -40px) scale(1.15); } }
  .logo-xl { width: 104px; height: 104px; filter: drop-shadow(0 18px 40px rgba(99,102,241,.55)); animation: float 6s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-10px) rotate(-2deg); } }
  .eyebrow { margin-top: 26px; font-size: 19px; font-weight: 600; color: var(--subtle); }
  h1 { font-size: clamp(44px, 8vw, 92px); line-height: 1.02; letter-spacing: -.035em; font-weight: 700; margin: 8px auto 0; max-width: 960px; }
  .lead { font-size: clamp(18px, 2.3vw, 24px); color: var(--subtle); max-width: 680px; margin: 22px auto 0; line-height: 1.4; }
  .cta { display: flex; gap: 14px; justify-content: center; align-items: center; margin-top: 36px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 600; padding: 14px 28px; border-radius: 999px;
         transition: transform .25s, box-shadow .25s; }
  .btn svg { width: 18px; height: 18px; }
  .btn.primary { background: linear-gradient(135deg, var(--a1), var(--a2)); box-shadow: 0 12px 34px rgba(99,102,241,.4); }
  .btn.primary:hover { transform: scale(1.04); box-shadow: 0 16px 44px rgba(99,102,241,.55); }
  .btn.link { color: var(--a1); padding: 14px 10px; }
  .btn.link:hover { text-decoration: underline; }
  .meta { color: var(--subtle); font-size: 13px; margin-top: 14px; }
  .scrollhint { margin-top: 60px; color: var(--subtle); font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .scrollhint i { width: 22px; height: 34px; border-radius: 12px; border: 2px solid #3A4668; position: relative; }
  .scrollhint i::after { content: ""; position: absolute; left: 50%; top: 6px; width: 4px; height: 7px; margin-left: -2px; border-radius: 2px; background: var(--a1); animation: wheel 1.6s infinite; }
  @keyframes wheel { 60% { transform: translateY(10px); opacity: 0; } 100% { opacity: 0; } }

  /* ---------- Racconto: la shell resta ferma e cambia scena mentre si scorre ---------- */
  .story { position: relative; padding: 40px 0 0; }
  .sticky { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 48px; align-items: center;
            max-width: 1240px; margin: 0 auto; padding: 0 28px; }
  /* frecce ai lati della finestra */
  .arrow { position: absolute; top: 50%; translate: 0 -50%; z-index: 10; width: 48px; height: 48px; border-radius: 50%; cursor: pointer;
           display: grid; place-items: center; border: 1px solid rgba(255,255,255,.14); background: rgba(15,21,38,.75); backdrop-filter: blur(10px);
           color: #fff; transition: transform .2s, background .2s; }
  .arrow:hover { transform: scale(1.1); background: rgba(99,102,241,.6); }
  .arrow svg { width: 20px; height: 20px; }
  .arrow.prev { left: -24px; } .arrow.next { right: -24px; }
  /* pulsanti delle scene, con la barra che si riempie */
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 1240px; margin: 34px auto 0; padding: 0 28px; }
  .chip { position: relative; overflow: hidden; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600; color: var(--subtle);
          padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); transition: color .2s, border-color .2s; }
  .chip:hover { color: #fff; border-color: #4A5A85; }
  .chip.on { color: #fff; border-color: rgba(99,102,241,.6); }
  .chip i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, rgba(96,165,250,.35), rgba(99,102,241,.35)); }
  .chip span { position: relative; }
  .caps { position: relative; height: 300px; }
  .cap { position: absolute; inset: 0; opacity: 0; transform: translateY(18px); pointer-events: none;
         transition: opacity .3s ease, transform .45s cubic-bezier(.2,.8,.2,1); }
  .cap.on { opacity: 1; transform: none; transition-delay: .12s; }
  .cap.gone { transform: translateY(-18px); }
  .cap .num { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--a1); }
  .cap h2 { font-size: clamp(30px, 3.6vw, 46px); line-height: 1.06; letter-spacing: -.025em; margin-top: 10px; }
  .cap p { color: var(--subtle); font-size: 18px; margin-top: 14px; line-height: 1.45; }
  .progress { position: absolute; left: 0; bottom: -40px; display: flex; gap: 6px; }
  .progress i { width: 6px; height: 6px; border-radius: 3px; background: #2A3552; transition: width .4s, background .4s; }
  .progress i.on { width: 26px; background: linear-gradient(90deg, var(--a1), var(--a2)); }

  .mwrap { position: relative; container-type: inline-size; }
  .mw { position: relative; aspect-ratio: 16 / 10; border-radius: 2.2cqw; overflow: hidden;
        border: 1px solid rgba(255,255,255,.12); box-shadow: 0 50px 120px rgba(0,0,0,.7);
        background: radial-gradient(60% 60% at 12% 8%, var(--g1), transparent 70%), radial-gradient(60% 60% at 92% 96%, var(--g2), transparent 70%),
                    linear-gradient(135deg, var(--bt), var(--bb));
        transition: --bt 1s, --bb 1s, --g1 1s, --g2 1s; }
  /* barra del titolo */
  .mbar { position: absolute; left: 0; right: 0; top: 0; height: 9%; display: flex; align-items: center; justify-content: space-between; padding: 0 2.4cqw; }
  .mbar .t { display: flex; align-items: center; gap: .9cqw; font-size: 1.15cqw; font-weight: 700; letter-spacing: .12em; color: #AEB8D0; }
  .mbar .t svg { width: 2.6cqw; height: 2.6cqw; }
  .msearch { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 26%; display: flex; gap: .8cqw; align-items: center;
             font-size: 1.4cqw; color: #AEB8D0; border-bottom: 1px solid #3A4668; padding-bottom: .5cqw; }
  .msearch svg { width: 1.4cqw; height: 1.4cqw; flex: none; }
  .msearch .q { color: #fff; }
  .msearch .q:not(:empty)::after { content: ""; display: inline-block; width: 1px; height: 1.2em; background: var(--a1); vertical-align: middle; margin-left: 1px; animation: caret .8s step-end infinite; }
  .msearch .ph { transition: opacity .2s; }
  @keyframes caret { 50% { opacity: 0; } }
  .mctl { display: flex; align-items: center; gap: 1.8cqw; }
  .mctl .gear { width: 2cqw; height: 2cqw; transition: opacity .4s, transform .4s; }
  .mw.locked .mctl .gear { opacity: 0; transform: scale(.5) rotate(-90deg); }
  .sw { width: 3.8cqw; height: 2.1cqw; border-radius: 2cqw; background: #2A3552; border: 1px solid #3A4A72; position: relative; transition: background .4s; }
  .sw::after { content: ""; position: absolute; top: 50%; left: .25cqw; width: 1.5cqw; height: 1.5cqw; margin-top: -.75cqw; border-radius: 50%; background: #fff; transition: transform .4s var(--spring); }
  .mw.locked .sw { background: linear-gradient(135deg, var(--a1), var(--a2)); border-color: transparent; }
  .mw.locked .sw::after { transform: translateX(1.7cqw); }
  .mctl .wb { width: 1.6cqw; height: 1.6cqw; border: 1.5px solid #7F8AA6; border-radius: .35cqw; }
  /* intestazione: come nell'app, bloccando si richiude verso l'alto */
  .mbar .t { transition: opacity .25s; }
  .mw.locked .mbar .t { opacity: 0; }
  .mhead, .madd { transform-origin: 50% 0; transition: opacity .25s, transform .35s cubic-bezier(.65,0,.35,1); }
  .mw.locked .mhead, .mw.locked .madd { opacity: 0; transform: scaleY(0); }
  .mhead { position: absolute; left: 4.5%; top: 12%; }
  .mhead b { display: flex; align-items: center; gap: 1cqw; font-size: 3cqw; letter-spacing: -.02em; }
  .mhead small { display: block; color: var(--subtle); font-size: 1.3cqw; }
  .madd { position: absolute; right: 4%; top: 12.5%; display: flex; gap: 1cqw; }
  .madd span { font-size: 1.3cqw; font-weight: 600; padding: .9cqw 1.6cqw; border-radius: 1cqw; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); }
  .madd span.p { background: linear-gradient(135deg, var(--a1), var(--a2)); border-color: transparent; }
  /* area riquadri (bloccata: sale al posto dell'intestazione) */
  .area { position: absolute; left: 6%; width: 88%; top: 30%; height: 54%; transition: top .35s cubic-bezier(.65,0,.35,1); }
  .mw.locked .area { top: 16%; }
  /* puntino "app aperta", come nel Dock */
  .tl .run { position: absolute; left: 50%; bottom: -10%; width: .8cqw; height: .8cqw; margin-left: -.4cqw; border-radius: 50%; background: #fff;
             box-shadow: 0 0 .8cqw #fff; opacity: 0; transition: opacity .4s; }
  .tl.running .run { opacity: 1; }
  /* nome della pagina sopra i pallini */
  .pname { position: absolute; left: 50%; bottom: 10%; translate: -50% 0; font-size: 1.5cqw; font-weight: 600; color: #fff; white-space: nowrap; }
  .mw.locked .mdots .plus { opacity: 0; }
  /* zone di rilascio in basso mentre si trascina */
  .dropbar { position: absolute; left: 50%; bottom: 3%; translate: -50% 0; display: flex; gap: 2cqw; z-index: 5; opacity: 0; transform: translateY(60%);
             transition: opacity .3s, transform .35s var(--spring); }
  .dropbar.on { opacity: 1; transform: none; }
  .dropbar span { display: flex; align-items: center; gap: 1cqw; padding: 1.2cqw 2.6cqw; border-radius: 2cqw; font-size: 1.5cqw; font-weight: 600;
                  background: rgba(26,35,64,.92); border: 1px solid #3A4A72; box-shadow: 0 1cqw 2.4cqw rgba(0,0,0,.5); transition: transform .25s, background .25s; }
  .dropbar span svg { width: 1.7cqw; height: 1.7cqw; }
  .dropbar span.hot { background: rgba(239,68,68,.85); border-color: transparent; transform: scale(1.12); }
  .tl { position: absolute; width: calc(13% * var(--s, 1)); aspect-ratio: 1; transition: left .75s var(--spring), top .75s var(--spring),
        transform .6s var(--spring), opacity .5s, width .6s var(--spring); --c1: #3B82F6; --c2: #1E3A8A; }
  .tl .card { position: absolute; inset: 0; border-radius: 22%; border: 1px solid rgba(255,255,255,.22);
              background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,0) 55%), linear-gradient(135deg, var(--c1), var(--c2));
              box-shadow: 0 1.2cqw 2.6cqw -.8cqw var(--c2); transition: --c1 .7s, --c2 .7s; }
  .tl .ic { position: absolute; left: 24%; top: 14%; width: 52%; height: 52%; }
  .tl .ic > * { width: 100%; height: 100%; display: block; filter: drop-shadow(0 .3cqw .5cqw rgba(0,0,0,.3)); }
  .tl b { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; font-size: calc(1.25cqw * var(--s, 1)); font-weight: 600; white-space: nowrap; color: #fff; }
  .tl.hide { opacity: 0; transform: scale(.4); }
  .tl.left { opacity: 0; transform: translateX(-260%); }
  .tl.right { opacity: 0; transform: translateX(260%); }
  .tl.ring::after { content: ""; position: absolute; inset: -6%; border-radius: 24%; border: .25cqw solid #fff; animation: ringout .8s ease-out forwards; }
  @keyframes ringout { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.3); } }
  .tl.lift { z-index: 3; }
  .tl.lift .card { box-shadow: 0 2.4cqw 4cqw -1cqw rgba(0,0,0,.6); }
  /* pallini pagine + tooltip */
  .mdots { position: absolute; left: 50%; bottom: 6.5%; translate: -50% 0; display: flex; gap: .9cqw; align-items: center; }
  .mdots i { position: relative; width: .8cqw; height: .8cqw; border-radius: .4cqw; background: #5B6788; transition: width .4s, background .4s; }
  .mdots i.on { width: 2.8cqw; background: #fff; }
  .mdots .plus { width: 1.2cqw; height: 1.2cqw; background: none; color: #8E98AE; font-style: normal; font-size: 1.6cqw; line-height: 1.2cqw; text-align: center; }
  .tip { position: absolute; bottom: 10.5%; padding: .6cqw 1.2cqw; border-radius: .8cqw; font-size: 1.2cqw; font-weight: 600; white-space: nowrap;
         background: #F1F5F9; color: #0B1020; translate: -50% 0; opacity: 0; transform: translateY(.6cqw); transition: opacity .25s, transform .25s; pointer-events: none; }
  .tip.on { opacity: 1; transform: none; }
  /* zona di rilascio */
  .drop { position: absolute; left: 4%; right: 4%; top: 27%; bottom: 13%; border-radius: 1.6cqw; border: .25cqw dashed var(--a1); background: rgba(96,165,250,.1);
          display: grid; place-items: center; color: var(--a1); font-weight: 700; font-size: 2.2cqw; opacity: 0; transition: opacity .3s; }
  .drop.on { opacity: 1; }
  /* menu tasto destro */
  .menu { position: absolute; min-width: 19%; padding: .6cqw; border-radius: 1.2cqw; background: rgba(20,28,49,.96); border: 1px solid rgba(255,255,255,.12);
          box-shadow: 0 2cqw 4cqw rgba(0,0,0,.55); backdrop-filter: blur(10px); z-index: 7; opacity: 0; transform: scale(.85); transform-origin: 0 0;
          transition: opacity .25s, transform .3s var(--spring); pointer-events: none; }
  .menu.on { opacity: 1; transform: none; }
  .menu div { font-size: 1.35cqw; padding: .7cqw 1.1cqw; border-radius: .7cqw; color: #E2E8F0; display: flex; align-items: center; gap: .9cqw; }
  .menu div svg { width: 1.5cqw; height: 1.5cqw; flex: none; }
  .menu hr { border: 0; height: 1px; background: rgba(255,255,255,.08); margin: .4cqw .6cqw; }
  .menu div.hot { background: rgba(239,68,68,.18); color: #FCA5A5; }
  .mw.locked .menu .ed { display: none; }   /* bloccata: niente Modifica / Rimuovi */
  .menu div.hov { background: rgba(255,255,255,.08); }
  /* PIN */
  .pin { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 34%; padding: 2.4cqw; border-radius: 2cqw; text-align: center; z-index: 7;
         background: rgba(15,21,38,.97); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 3cqw 6cqw rgba(0,0,0,.6);
         opacity: 0; transform: scale(.9); transition: opacity .3s, transform .35s var(--spring); }
  .pin.on { opacity: 1; transform: none; }
  .pin svg { width: 4cqw; height: 4cqw; }
  .pin p { font-size: 1.6cqw; font-weight: 600; margin-top: 1cqw; }
  .pin .pd { display: flex; justify-content: center; gap: 1.4cqw; margin-top: 1.6cqw; }
  .pin .pd i { width: 1.5cqw; height: 1.5cqw; border-radius: 50%; border: .2cqw solid #5B6788; transition: background .2s, border-color .2s; }
  .pin .pd i.f { background: #fff; border-color: #fff; }
  .shade { position: absolute; inset: 0; background: rgba(0,0,0,.35); opacity: 0; transition: opacity .3s; z-index: 6; pointer-events: none; }
  .shade.on { opacity: 1; }
  /* puntatore */
  .cur { position: absolute; width: 2.4cqw; left: 110%; top: 60%; z-index: 9; filter: drop-shadow(0 .3cqw .5cqw rgba(0,0,0,.5));
         transition: left .8s cubic-bezier(.5,0,.2,1), top .8s cubic-bezier(.5,0,.2,1), transform .15s; }
  .cur.press { transform: scale(.8); }
  /* collegamento che vola dentro */
  .fly { position: absolute; width: 9%; z-index: 8; text-align: center; opacity: 0; pointer-events: none; }
  .fly svg { width: 100%; aspect-ratio: 1; display: block; filter: drop-shadow(0 1cqw 1.6cqw rgba(0,0,0,.5)); }
  .fly span { display: block; font-size: 1.3cqw; font-weight: 600; margin-top: .4cqw; text-shadow: 0 1px 3px #000; }

  /* ---------- Numeri ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 40px; }
  .stat { text-align: center; padding: 34px 16px; border-radius: 24px; background: var(--panel); border: 1px solid var(--border); }
  .stat b { display: block; font-size: clamp(40px, 5vw, 60px); letter-spacing: -.04em; line-height: 1; }
  .stat span { color: var(--subtle); font-size: 15px; display: block; margin-top: 10px; }

  section { padding: 140px 0 0; }
  .big { text-align: center; }
  .big h2 { font-size: clamp(38px, 6.5vw, 72px); line-height: 1.04; letter-spacing: -.03em; font-weight: 700; }
  .big > p { font-size: clamp(18px, 2.2vw, 23px); color: var(--subtle); max-width: 700px; margin: 20px auto 0; line-height: 1.4; }

  /* ---------- Prezzo ---------- */
  .price { max-width: 520px; margin: 60px auto 0; text-align: center; padding: 46px 36px; border-radius: 32px;
           background: linear-gradient(var(--panel), var(--panel)) padding-box, linear-gradient(135deg, var(--a1), var(--a2), var(--a3)) border-box;
           border: 1.5px solid transparent; box-shadow: 0 30px 80px rgba(99,102,241,.25); }
  .heart { width: 46px; height: 46px; animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } 60% { transform: none; } }
  .free { font-size: 20px; font-weight: 700; margin-top: 14px; }
  .amount { font-size: 72px; font-weight: 700; letter-spacing: -.04em; }
  .amount small { font-size: 22px; color: var(--subtle); font-weight: 600; letter-spacing: 0; }
  .price ul { list-style: none; margin: 22px auto 30px; display: grid; gap: 10px; text-align: left; width: fit-content; color: var(--subtle); }
  .price li { display: flex; gap: 10px; align-items: center; }
  .price li svg { width: 18px; height: 18px; flex: none; }
  .note { font-size: 14px; color: var(--subtle); margin-top: 18px; }

  /* ---------- Passi ---------- */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 60px; text-align: left; }
  .step { padding: 30px; border-radius: 24px; background: var(--panel); border: 1px solid var(--border); }
  .step .n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
             background: linear-gradient(135deg, var(--a1), var(--a2)); margin-bottom: 18px; }
  .step h3 { font-size: 20px; } .step p { color: var(--subtle); margin-top: 6px; }

  .final { text-align: center; padding: 160px 0 130px; }
  footer { border-top: 1px solid var(--border); color: var(--subtle); font-size: 12px; }
  footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 22px; }
  .legal { max-width: 1120px; margin: 0 auto; padding: 0 22px 22px; color: #5B6788; font-size: 11px; }

      const onPage = (a.page || 0) === st.page;
      el.classList.remove("left", "right", "hide");
      if (st.drag && st.drag[0] === id) { el.style.left = st.drag[1] + "%"; el.style.top = st.drag[2] + "%"; }
      else if (i >= 0) { const [x, y] = pos(i); el.style.left = x + "%"; el.style.top = y + "%"; }
      if (i < 0) el.classList.add(!onPage ? (st.page === 0 ? "right" : "left") : "hide");
      const c = st.colors[id] || a.color;
      el.style.setProperty("--c1", mix(c, 255, .12));
      el.style.setProperty("--c2", mix(c, 0, .45));
      const k = st.icons[id] || (a.img ? "img" : a.lib);
      if (el.dataset.k !== k) {
        const ic = el.querySelector(".ic");
        ic.innerHTML = k === "img" ? `<img src="${a.img}" alt="">` : svgIcon(k);
        if (el.dataset.k) ic.animate([{ transform: "scale(.3) rotate(-25deg)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 500, easing: "cubic-bezier(.34,1.5,.5,1)" });
        el.dataset.k = k;
      }
      el.querySelector("b").textContent = nameOf(id);
      el.classList.toggle("ring", st.ring === id);
      el.classList.toggle("lift", st.lift === id);
      el.classList.toggle("running", st.running.includes(id));
    }
    area.style.setProperty("--s", st.s);
    const th = THEMES[st.theme];
    mw.style.setProperty("--bt", th[0]); mw.style.setProperty("--bb", th[1]);
    mw.style.setProperty("--g1", rgba(th[2], .4)); mw.style.setProperty("--g2", rgba(th[3], .4));
    mw.classList.toggle("locked", st.lock);
    $("pcount").textContent = T.appsN[L].replace("{0}", st.work.length + (st.extra ? 1 : 0) - (st.removed ? 1 : 0) + GFX.length);
    // Nome della pagina sopra i pallini: ricompare con una dissolvenza a ogni cambio pagina
    const pn = $("pname"), pt = st.page === 0 ? t("work") : t("gfx");
    if (pn.textContent !== pt) {
      pn.textContent = pt;
      pn.animate([{ opacity: 0, transform: "translateY(.6cqw)" }, { opacity: 1, transform: "none" }], { duration: 300, easing: "ease-out" });
    }
    const db = $("dropbar");
    db.classList.toggle("on", !!st.dropbar);
    $("dbEdit").classList.toggle("hot", st.dropbar === "edit");
    $("dbTrash").classList.toggle("hot", st.dropbar === "trash");
    const dots = $("mdots").querySelectorAll("i:not(.plus)");
    dots.forEach((d, n) => d.classList.toggle("on", n === st.page));
    $("q").textContent = st.q; $("ph").style.opacity = st.q ? 0 : 1;
    $("drop").classList.toggle("on", st.drop);
    $("pin").classList.toggle("on", st.pin > 0);
    $("shade").classList.toggle("on", st.pin > 0 || !!st.menu);
    $("pd").querySelectorAll("i").forEach((d, n) => d.classList.toggle("f", n < st.pin - 1));
    const menu = $("menu");
    menu.classList.toggle("on", !!st.menu);
    if (st.menu) { menu.style.left = st.menu.x + "%"; menu.style.top = st.menu.y + "%"; }
    $("mRemove").classList.toggle("hot", !!(st.menu && st.menu.hot));
  }

  // Centro di un riquadro / di un elemento in % della finestra (per puntatore e menu)
  function tileCenter(i) { const [x, y] = pos(i); return [6 + .88 * (x + 6.5 * st.s), (st.lock ? 16 : 30) + .54 * (y + 16.9 * st.s)]; }
  function elCenter(el) {
    const r = el.getBoundingClientRect(), m = mw.getBoundingClientRect();
    return [(r.left + r.width / 2 - m.left) / m.width * 100, (r.top + r.height / 2 - m.top) / m.height * 100];
  }
  const cur = $("cur");
  function cursor(x, y) { cur.style.left = x + "%"; cur.style.top = y + "%"; }
  function click() { cur.classList.add("press"); later(() => cur.classList.remove("press"), 160); }

  // ===== Scene =====
  let timers = [];
  // Mouse sopra la finestra = scena in pausa (si guarda con calma); riparte quando esce.
  let paused = false;
  mw.addEventListener("mouseenter", () => { paused = true; mw.getAnimations({ subtree: true }).forEach(a => a.pause()); });
  mw.addEventListener("mouseleave", () => { paused = false; mw.getAnimations({ subtree: true }).forEach(a => a.play()); });
  function later(fn, ms) { const run = () => paused ? timers.push(setTimeout(run, 200)) : fn(); timers.push(setTimeout(run, ms)); }
  function stop() { timers.forEach(clearTimeout); timers = []; }
  const set = patch => { Object.assign(st, patch); render(); };

  const SCENES = [
    // 0: apertura
    () => cursor(110, 60),
    // 1: un collegamento entra e diventa un'icona
    function add() {
      set({ extra: false });
      const [tx, ty] = tileCenter(7);
      later(() => {
        $("fly").animate([
          { left: "-16%", top: "48%", opacity: 0, transform: "scale(1)" },
          { left: "-12%", top: "46%", opacity: 1, transform: "scale(1.1) rotate(-6deg)", offset: .15 },
          { left: (tx - 4.5) + "%", top: (ty - 12) + "%", opacity: 1, transform: "scale(1.1) rotate(4deg)", offset: .8 },
          { left: (tx - 4.5) + "%", top: (ty - 12) + "%", opacity: 0, transform: "scale(.4)" },
        ], { duration: 1900, easing: "cubic-bezier(.6,0,.3,1)", fill: "forwards" });
      }, 300);
      later(() => set({ drop: true }), 900);
      later(() => set({ drop: false, extra: true }), 2150);
      later(add, 5200);
    },
    // 2: due icone si scambiano
    function swap() {
      set({ extra: true });
      const w = st.work, a = w.indexOf("vlc"), b = w.indexOf("edge");
      const [x1, y1] = tileCenter(a);
      cursor(x1, y1);
      later(() => { click(); set({ lift: "vlc" }); }, 700);
      later(() => { const [x2, y2] = tileCenter(b); cursor(x2, y2); [w[a], w[b]] = [w[b], w[a]]; render(); }, 1100);
      later(() => set({ lift: null }), 1900);
      later(swap, 2900);
    },
    // 3: icona originale o della libreria, e colore
    function icons() {
      let n = 0;
      set({ extra: true });
      cursor(110, 60);
      const libs = ["robot", "gear", "torque", "app-code"];
      (function step() {
        n++;
        st.icons.robot = libs[n % libs.length];
        st.colors.robot = ALT[n % ALT.length];
        st.icons.npp = n % 2 ? "app-notepad" : undefined;
        st.colors.npp = n % 2 ? "#0EA5E9" : undefined;
        st.icons.vlc = n % 2 ? "app-video" : undefined;
        st.colors.vlc = n % 2 ? "#EF4444" : undefined;
        render();
        later(step, 1500);
      })();
    },
    // 4: rimuovere — col tasto destro, oppure trascinando l'icona in basso su "Rimuovi"
    (() => {
      let byDrag = false;
      return function remove() {
        set({ extra: true, removed: null, menu: null, dropbar: null, drag: null });
        const id = byDrag ? "explorer" : "notepad";
        const i = list().indexOf(id);
        const [x, y] = tileCenter(i);
        cursor(x, y);
        if (!byDrag) {
          later(() => { click(); set({ menu: { x: x + 1, y: y - 24, hot: false } }); }, 900);
          later(() => cursor(x + 8, y + 7), 1300);
          later(() => set({ menu: { x: x + 1, y: y - 24, hot: true } }), 1900);
          later(() => { click(); set({ menu: null, removed: id }); }, 2400);
        } else {
          // Trascinando un'icona compaiono in basso "Modifica" e "Rimuovi"
          later(() => { click(); set({ lift: id, dropbar: "on" }); }, 800);
          later(() => {
            const [tx, ty] = elCenter($("dbTrash"));
            cursor(tx, ty);
            set({ drag: [id, (tx - 6) / .88 - 6.5, (ty - 30) / .54 - 16.9] });
          }, 1100);
          later(() => set({ dropbar: "trash" }), 1800);
          later(() => set({ dropbar: null, lift: null, removed: id }), 2400);
        }
        later(() => cursor(110, 60), 2900);
        later(() => set({ removed: null, drag: null }), 4300);
        later(() => { byDrag = !byDrag; remove(); }, 5300);
      };
    })(),
    // 5: pagine con nome: il nome compare sopra i pallini
    function pages() {
      set({ extra: true });
      const go = st.page === 0 ? 1 : 0;
      const dots = $("mdots").querySelectorAll("i:not(.plus)");
      cursor(...elCenter(dots[go]));
      later(() => { click(); set({ page: go }); }, 1000);
      later(pages, 3000);
    },
    // 6: cerca, Invio: l'app si apre e sotto compare il puntino "aperta"
    function search() {
      set({ extra: true, page: 0, q: "", running: ["firefox", "code"] });
      cursor(110, 60);
      later(() => set({ q: "v" }), 500);
      later(() => set({ q: "vl" }), 750);
      later(() => set({ q: "vlc" }), 1000);
      later(() => set({ ring: "vlc" }), 1700);
      later(() => set({ running: ["firefox", "code", "vlc"] }), 2000);
      later(() => set({ ring: null }), 2600);
      later(() => set({ q: "" }), 3300);
      later(search, 4800);
    },
    // 7: interruttore di blocco: l'intestazione si richiude, il tasto destro non può più modificare; per sbloccare serve il PIN
    function lock() {
      set({ extra: true, page: 0, lock: false, pin: 0, menu: null });
      const sw = document.querySelector(".sw");
      cursor(...elCenter(sw));
      later(() => { click(); set({ lock: true }); }, 900);
      later(() => { const [x, y] = tileCenter(0); cursor(x, y); }, 1700);
      later(() => { const [x, y] = tileCenter(0); click(); set({ menu: { x: x + 1, y: y - 10, hot: false } }); }, 2500);
      later(() => set({ menu: null }), 3800);
      later(() => cursor(...elCenter(sw)), 4100);
      later(() => { click(); set({ pin: 1 }); }, 4900);
      [5300, 5550, 5800, 6050].forEach((ms, n) => later(() => set({ pin: n + 2 }), ms));
      later(() => set({ pin: 0, lock: false }), 6500);
      later(() => cursor(110, 60), 6900);
      later(lock, 8200);
    },
    // 8: sfondi della shell, colori delle icone, dimensioni
    function custom() {
      let n = 0;
      set({ extra: true, page: 0 });
      cursor(110, 60);
      (function step() {
        n++;
        st.theme = n % THEMES.length;
        st.colors = {};
        if (n % 2) st.work.concat(["robot"]).forEach((id, i) => st.colors[id] = ALT[(i + n) % ALT.length]);
        st.s = (n % 4 === 2 || n % 4 === 3) ? 1.2 : 1;
        render();
        later(step, 1600);
      })();
    },
  ];

  // Didascalie e indicatore
  const caps = $("caps"), prog = $("prog");
  SCENES.forEach((_, i) => {
    caps.insertAdjacentHTML("beforeend", `<div class="cap" data-i="${i}"><div class="num">${String(i + 1).padStart(2, "0")}</div><h2 data-t="c${i}t"></h2><p data-t="c${i}"></p></div>`);
    prog.insertAdjacentHTML("beforeend", "<i></i>");
  });
  // Presentazione: le scene avanzano da sole; frecce e pulsanti per andare dove si vuole.
  const N = SCENES.length;
  const DUR = [3500, 5200, 5800, 6000, 10600, 6000, 4800, 8200, 6400];   // durata di ogni scena (ms)
  const chips = $("chips");
  for (let i = 0; i < N; i++) {
    const b = document.createElement("button");
    b.className = "chip";
    b.innerHTML = `<i></i><span data-t="k${i}"></span>`;
    b.addEventListener("click", () => enter(i));
    chips.appendChild(b);
  }
  $("prevBtn").addEventListener("click", () => enter((scene + N - 1) % N));
  $("nextBtn").addEventListener("click", () => enter((scene + 1) % N));

  let scene = -1;
  function enter(i) {
    if (i === scene) return;
    scene = i;
    stop();
    $("fly").getAnimations().forEach(a => a.cancel());
    st = baseState();
    render();
    caps.querySelectorAll(".cap").forEach(c => { c.classList.toggle("on", +c.dataset.i === i); c.classList.toggle("gone", +c.dataset.i < i); });
    prog.querySelectorAll("i").forEach((p, n) => p.classList.toggle("on", n === i));
    chips.querySelectorAll(".chip").forEach((c, n) => { c.classList.toggle("on", n === i); c.querySelector("i").style.width = "0"; });
    elapsed = 0;
    SCENES[i]();
  }
  // Avanzamento automatico: si ferma col mouse sulla finestra e quando la sezione non è visibile.
  let elapsed = 0, visible = false;
  new IntersectionObserver(es => { visible = es[0].isIntersecting; }, { threshold: .3 }).observe(mw);
  setInterval(() => {
    if (paused || !visible || scene < 0) return;
    elapsed += 100;
    const bar = chips.children[scene].querySelector("i");
    bar.style.width = Math.min(100, elapsed / DUR[scene] * 100) + "%";
    if (elapsed >= DUR[scene]) enter((scene + 1) % N);
  }, 100);

  // ===== Lingua =====
  function setLang(code) {
    L = Math.max(0, LANGS.indexOf(code));
    document.documentElement.lang = LANGS[L];
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = T[el.dataset.t][L]; });
    $("priceValue").textContent = PRICE[L];
    document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.l === LANGS[L]));
    try { localStorage.setItem("lang", LANGS[L]); } catch (e) {}
    if (st) render();
  }
  document.querySelectorAll("#langs button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.l)));
  document.querySelectorAll("a.download").forEach(a => a.href = DOWNLOAD_URL);
  // Finché il link del contributo non c'è, il pulsante non compare (niente pulsanti che non portano da nessuna parte).
  document.querySelectorAll("a.support").forEach(a => { a.href = SUPPORT_URL; if (SUPPORT_URL === "#") a.style.display = "none"; });
  let saved = null;
  try { saved = localStorage.getItem("lang"); } catch (e) {}
  setLang(saved || (navigator.language || "en").slice(0, 2).toLowerCase());
  enter(0);

  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .15 });
  document.querySelectorAll(".rv").forEach(el => io.observe(el));
</script>
</body>
